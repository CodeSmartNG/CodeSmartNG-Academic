    <!-- ── Advanced Boot Loader & Styles ──────────────────── -->
    <style>
      /* ── Boot Loader ────────────────────────────────────── */
      #boot-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at center, #1b4a7a 0%, #0b2b4f 100%);
        z-index: 9999;
        font-family: 'Inter', system-ui, sans-serif;
        transition: opacity 0.5s ease;
      }

      #boot-loader .logo-container {
        position: relative;
        width: 100px;
        height: 100px;
        margin-bottom: 24px;
      }

      #boot-loader .logo-circle {
        position: absolute;
        inset: 0;
        border-radius: 28px;
        background: linear-gradient(135deg, #ffb347 0%, #f59e0b 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 48px;
        color: #0b2b4f;
        box-shadow: 0 12px 40px rgba(255, 179, 71, 0.4);
        animation: float 3s ease-in-out infinite;
      }

      #boot-loader .ring {
        position: absolute;
        inset: -15px;
        border-radius: 40px;
        border: 2px solid rgba(255, 179, 71, 0.2);
        animation: ring-pulse 2s ease-out infinite;
      }

      #boot-loader h1 {
        color: white;
        font-size: 26px;
        font-weight: 700;
        margin: 0 0 8px;
        letter-spacing: -0.5px;
      }

      #boot-loader p {
        color: #94a3b8;
        font-size: 14px;
        margin: 0;
        font-weight: 500;
        letter-spacing: 0.5px;
      }

      #boot-loader .loading-bar {
        margin-top: 40px;
        width: 200px;
        height: 4px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 10px;
        overflow: hidden;
      }

      #boot-loader .loading-bar-inner {
        height: 100%;
        width: 40%;
        background: linear-gradient(90deg, #ffb347, #f59e0b);
        border-radius: 10px;
        animation: loading 1.5s ease-in-out infinite;
      }

      @keyframes float {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-10px) rotate(2deg); }
      }

      @keyframes ring-pulse {
        0% { transform: scale(1); opacity: 1; }
        100% { transform: scale(1.3); opacity: 0; }
      }

      @keyframes loading {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(300%); }
      }

      /* ── Fade out loader ────────────────────────────────── */
      body.app-ready #boot-loader {
        opacity: 0;
        pointer-events: none;
      }

      /* ── Base reset ─────────────────────────────────────── */
      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        padding: 0;
        font-family: 'Inter', system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background: #f8fafc;
      }

      /* ── Prevent iOS zoom on input focus ────────────────── */
      input, select, textarea {
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <!-- ── Premium Boot Loader ────────────────────────────── -->
    <div id="boot-loader">
      <div class="logo-container">
        <div class="ring"></div>
        <div class="logo-circle">
          <i class="fas fa-graduation-cap"></i>
        </div>
      </div>
      <h1>CodeSmartNG</h1>
      <p>Academic Portal</p>
      <div class="loading-bar">
        <div class="loading-bar-inner"></div>
      </div>
    </div>

    <!-- ── React Root ────────────────────────────────────── -->
    <div id="root"></div>

    <!-- ── Auto-hide loader when React is mounted ─────────── -->
    <script>
      const root = document.getElementById("root");
      const loader = document.getElementById("boot-loader");

      const observer = new MutationObserver(() => {
        if (root.children.length > 0) {
          document.body.classList.add("app-ready");
          setTimeout(() => loader.remove(), 500);
          observer.disconnect();
        }
      });

      observer.observe(root, { childList: true, subtree: false });

      // Failsafe: hide loader after 8 seconds
      setTimeout(() => {
        if (document.body.contains(loader)) {
          document.body.classList.add("app-ready");
          loader.remove();
        }
      }, 8000);
    </script>

    <!-- ── Vite entry point ──────────────────────────────── -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
